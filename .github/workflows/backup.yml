name: Kopia zapasowa bazy

on:
  schedule:
    - cron: "0 3 * * 0" # co niedzielę ~4:00–5:00 czasu polskiego
  workflow_dispatch: # ręcznie z zakładki Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Kopia idzie mailem: leży w skrzynce dłużej niż 90 dni (limit artifactów) i nie trzeba wchodzić na GitHuba.
      - name: Zrzut bazy produkcyjnej
        run: pnpm backup "su-manager-$(date -u +%Y-%m-%d).sql" --mail
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
