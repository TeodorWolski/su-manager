name: Scraper okazji

on:
  # Główny wyzwalacz: zewnętrzny cron (cron-job.org) o 10:30 czasu polskiego woła workflow_dispatch
  # przez API GitHuba — GitHubowy harmonogram potrafi spóźnić się o kilka godzin.
  # Harmonogram poniżej to tylko zapas o 12:00 (latem 10:00 UTC, zimą 11:00 UTC; krok „pora” wybiera
  # właściwy). Mail wychodzi raz dziennie (app_state „morning-mail”), zapas tylko odświeży wydarzenia.
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      force_mail:
        description: "Wyślij poranny mail, nawet jeśli dziś już poszedł"
        type: boolean
        default: false

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pora (zapas 12:00 w Warszawie)
        id: time
        run: |
          offset=$(TZ=Europe/Warsaw date +%z)
          want="0 11 * * *"; [ "$offset" = "+0200" ] && want="0 10 * * *"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pomijam: ten cron nie odpowiada 12:00 przy przesunięciu $offset"
          fi
      - uses: actions/checkout@v4
        if: steps.time.outputs.run
      - uses: pnpm/action-setup@v4
        if: steps.time.outputs.run
      - uses: actions/setup-node@v4
        if: steps.time.outputs.run
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.time.outputs.run
      - run: pnpm scrape
        if: steps.time.outputs.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          FORCE_MAIL: ${{ inputs.force_mail }}
